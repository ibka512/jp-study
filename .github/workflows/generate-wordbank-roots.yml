name: 补全钟日英语词根词缀

on:
  workflow_dispatch:
    inputs:
      level:
        description: "处理等级"
        required: true
        default: CET-4
        type: choice
        options:
          - CET-4
          - CET-6
      max_words:
        description: "本次最多检查多少词"
        required: true
        default: "100"
        type: string
      batch_size:
        description: "每次 API 请求的词数"
        required: true
        default: "20"
        type: choice
        options:
          - "10"
          - "20"
  push:
    paths:
      - ".github/root-generation-request.json"

permissions:
  contents: write

concurrency:
  group: zhongri-wordbank-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LEVEL: ${{ inputs.level || 'CET-4' }}
      MAX_WORDS: ${{ inputs.max_words || '100' }}
      BATCH_SIZE: ${{ inputs.batch_size || '20' }}
      AUTO_APPLY: "false"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: 取出最新版项目
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 读取自动运行请求
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          import os

          with open('.github/root-generation-request.json', encoding='utf-8') as handle:
              request = json.load(handle)
          level = str(request.get('level', 'CET-4'))
          max_words = int(request.get('max_words', 100))
          batch_size = int(request.get('batch_size', 20))
          auto_apply = bool(request.get('auto_apply', False))
          if level not in {'CET-4', 'CET-6', 'ALL'}:
              raise SystemExit('level 必须是 CET-4、CET-6 或 ALL')
          if not 1 <= max_words <= 5000:
              raise SystemExit('max_words 必须是 1～5000')
          if not 1 <= batch_size <= 40:
              raise SystemExit('batch_size 必须是 1～40')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'LEVEL={level}\n')
              output.write(f'MAX_WORDS={max_words}\n')
              output.write(f'BATCH_SIZE={batch_size}\n')
              output.write(f'AUTO_APPLY={str(auto_apply).lower()}\n')
          PY

      - name: 检查 API 密钥
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::还没有设置 DEEPSEEK_API_KEY。"
            exit 1
          fi

      - name: 生成并校验词根词缀
        run: |
          python tools/generate_wordbank_roots.py \
            --level "$LEVEL" \
            --max-words "$MAX_WORDS" \
            --batch-size "$BATCH_SIZE" \
            $([ "$AUTO_APPLY" = "true" ] && echo "--apply")

      - name: 验证词库和学习流程
        run: |
          python -m unittest -v \
            tests.test_wordbank_compiler \
            tests.test_generate_wordbank_examples \
            tests.test_generate_wordbank_roots \
            tests.test_apply_root_review
          node --check data.js
          node --check english-data.js
          for file in wordbanks/*.js; do node --check "$file"; done
          node --check release-info.js
          node --check core-utils.js
          node --check haptics.js
          node --check app.js
          node tests/core-utils.test.js
          node tests/release-info.test.js
          node tests/haptics.test.js
          node tests/rote-learning-core.test.js
          node tests/rote-learning-integration.test.js
          node tests/wordbank-data.test.js
          git diff --check

      - name: 保存生成报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-generation-report-${{ github.run_number }}
          path: reports/root-generation-latest.*
          if-no-files-found: ignore
          retention-days: 30

      - name: 直接更新 main 并触发部署
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "没有需要补全的词根词缀。"
            exit 0
          fi
          git config user.name "钟日词根机器人"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js english-data.js index.html sw.js wordbanks \
            reports/root-generation-latest.json \
            reports/root-generation-latest.md
          if [ "$AUTO_APPLY" = "true" ]; then
            MESSAGE="自动补全英语词根词缀：${LEVEL} ${MAX_WORDS}词"
          else
            MESSAGE="生成英语词根审核候选：${LEVEL} ${MAX_WORDS}词"
          fi
          git commit -m "$MESSAGE"
          git push origin HEAD:main
